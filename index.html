 {id:'seat',name:'SEAT',cls:'seat',logo:'SEAT'},
 {id:'cupra',name:'CUPRA',cls:'cupra',logo:'CUPRA'}
];
function brandSelector(){
 localStorage.removeItem('kashoBrand');history.replaceState(null,'',location.pathname+location.search);
 detail.classList.add('hidden');home.classList.remove('hidden');brandHome.classList.remove('hidden');legacyHero.classList.add('hidden');legacyTabs.classList.add('hidden');count.classList.add('hidden');list.classList.add('hidden');
 brandHome.innerHTML='<section class="brandIntro"><h1>Vozila</h1><p>Izaberi marku vozila.</p><div class="brandGrid">'+VAG_BRANDS.map(b=>'<button class="brandCard" onclick="openBrand(\''+b.id+'\')"><div class="brandLogo '+(b.cls||'')+'">'+b.logo+'</div><div class="brandName">'+b.name+'</div></button>').join('')+'</div></section>';setV3Active('models');window.scrollTo(0,0)
}
function openBrand(id){
 localStorage.setItem('kashoBrand',id);brandHome.classList.add('hidden');legacyHero.classList.remove('hidden');legacyTabs.classList.add('hidden');count.classList.remove('hidden');list.classList.remove('hidden');
 const b=VAG_BRANDS.find(x=>x.id===id);legacyHero.querySelector('h1').textContent=b.name;legacyHero.querySelector('p').textContent='Modeli • evropsko tržište';
 if(id==='vw'){view='models';render();count.textContent=count.textContent.replace(' rezultata',' modela');}
 else if(id==='audi'){renderAudi();}
 else{count.textContent='0 modela';list.innerHTML='<div class="empty">Modeli za '+b.name+' biće dodati u sledećoj fazi baze.</div>'}
 legacyHero.insertAdjacentHTML('afterbegin','<button class="brandBack" onclick="brandSelector()">‹ Marke</button>');
 window.scrollTo(0,0)
}

function setV3Active(k){document.querySelectorAll('.v3nav').forEach(b=>b.classList.toggle('active',b.dataset.v3===k))}
function v3Go(k){
 if(k==='models'){brandSelector();return}
 if(k==='trans'){closeDetail();view='trans';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view==='trans'));setV3Active('trans');render();return}
 if(k==='search'){closeDetail();setV3Active('search');setTimeout(()=>{q.focus();q.scrollIntoView({behavior:'smooth',block:'center'})},80);return}
 if(k==='engines'){setV3Active('engines');openCRBC();window.scrollTo({top:0,behavior:'smooth'});return}
}


if(!location.hash)brandSelector();
restoreRoute();
</script><nav class="v3dock" id="v3dock" aria-label="Glavna navigacija">

<button class="v3nav" data-v3="engines" onclick="v3Go('engines')"><svg viewBox="0 0 24 24"><path d="M5 8h11l3 3v6H7l-2-2z"/><path d="M8 8V5h5v3M19 12h2v4h-2M5 11H3v5h2"/></svg><span>Motori</span></button>
<button class="v3nav" data-v3="trans" onclick="v3Go('trans')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 4v5M12 15v5M4 12h5M15 12h5"/></svg><span>Menjači</span></button>
<button class="v3nav" data-v3="search" onclick="v3Go('search')"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Pretraga</span></button>
