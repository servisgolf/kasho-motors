<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>KASHO TECH</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;color:#f5f7fa;background:#0b0d10}*{box-sizing:border-box}body{margin:0;background:#0b0d10}.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:23px;font-weight:850;letter-spacing:.5px}.brand b,.accent{color:#ef4444}.pill{font-size:12px;background:#191d23;padding:7px 10px;border-radius:99px;color:#aeb6c2}.hero{background:linear-gradient(145deg,#181c22,#111419);padding:20px;border-radius:22px;border:1px solid #252a31;margin-bottom:14px}.hero h1{font-size:27px;margin:0 0 6px}.hero p{margin:0;color:#9ca6b4;font-size:14px}.search{width:100%;margin-top:16px;border:1px solid #303640;background:#0c0f13;color:white;border-radius:15px;padding:15px 16px;font-size:16px;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tab,.back{border:0;border-radius:99px;background:#191d23;color:#bac2cd;padding:10px 14px;white-space:nowrap}.tab.active{background:#ef4444;color:#fff}.count{color:#7f8996;font-size:13px;margin:0 3px 10px}.card,.panel{background:#14181d;border:1px solid #242a31;border-radius:17px;padding:15px;margin:9px 0}.card.click{cursor:pointer}.title{font-size:18px;font-weight:750}.meta{color:#9da7b3;font-size:13px;margin-top:5px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;background:#20252c;border-radius:8px;padding:5px 7px;color:#c5ccd5}.empty{text-align:center;color:#818b98;padding:40px 15px}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,16,.94);backdrop-filter:blur(15px);border-top:1px solid #222831;padding:10px 18px calc(10px + env(safe-area-inset-bottom));text-align:center;color:#7f8996;font-size:12px}.detailHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.detailHead h1{font-size:27px;margin:0}.sectionTitle{font-size:13px;color:#ef4444;text-transform:uppercase;letter-spacing:.8px;margin:22px 3px 8px;font-weight:800}.engine{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:12px 0;border-bottom:1px solid #252a31}.engine:last-child{border:0}.engine b{font-size:15px}.engine small{color:#8993a0}.status{background:#161e19;border:1px solid #263c2c;color:#a8d5b3;padding:12px;border-radius:13px;font-size:13px;line-height:1.4}.warn{background:#201b13;border-color:#40331d;color:#d8c28d}.note{color:#aab2bd;font-size:13px;line-height:1.5;margin:8px 0}.diagItem{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid #252a31}.diagItem:last-child{border:0}.diagIcon{width:36px;height:36px;border-radius:10px;background:#1b1d22;border:1px solid #33252a;display:grid;place-items:center;color:#ef4444}.diagIcon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.diagText b{display:block;margin-bottom:4px;color:#d7dce4}.diagText span{color:#aab2bd;font-size:13px;line-height:1.5}.hidden{display:none}
</style></head><body><div class="wrap"><header><div class="brand">KASHO <b>TECH</b></div><div class="pill">V2 • VW EU</div></header><div id="home"><section class="hero"><h1>Servisna baza</h1><p>Pretraži model, platformu, oznaku ili menjač.</p><input id="q" class="search" placeholder="npr. Golf VII, MQB, 0GC, DQ381…" autocomplete="off"></section><div class="tabs"><button class="tab active" data-view="models">Vozila</button><button class="tab" data-view="trans">Menjači</button><button class="tab" data-view="fav">★ Favorites</button></div><div id="count" class="count"></div><main id="list"></main></div><main id="detail" class="hidden"></main></div><div class="footer">KASHO TECH V2 • offline-ready</div><script src="data.js"></script><script src="profiles.js"></script><script src="crbc.js"></script><script>
let view='models';const q=document.querySelector('#q'),list=document.querySelector('#list'),count=document.querySelector('#count'),home=document.querySelector('#home'),detail=document.querySelector('#detail');
const fav=()=>JSON.parse(localStorage.getItem('kashoFav')||'[]');function key(x){return JSON.stringify(x)}function toggle(x){let a=fav(),k=key(x);a=a.includes(k)?a.filter(v=>v!==k):[...a,k];localStorage.setItem('kashoFav',JSON.stringify(a));render()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function isGolf7(x){let s=Object.values(x).join(' ').toLowerCase();return s.includes('golf vii')&&!s.includes('variant')&&!s.includes('sportsvan')}
function card(x,type){let vals=Object.values(x).filter(Boolean).map(String),title=type==='models'?(vals[0]||'VW'):(vals[0]||'Menjač'),sub=vals.slice(1,4).join(' • '),tags=vals.slice(4).filter(v=>v.length<70).slice(0,5),k=key(x),star=fav().includes(k)?'★':'☆',click=type==='models'&&isGolf7(x);return '<article class="card '+(click?'click':'')+'" '+(click?'onclick="openGolf7()"':'')+'><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="title">'+esc(title)+(click?' <span class="accent">›</span>':'')+'</div><div class="meta">'+esc(sub)+'</div></div><button onclick=\'event.stopPropagation();toggle('+JSON.stringify(x)+')\' style="background:none;border:0;color:#f6c453;font-size:24px">'+star+'</button></div><div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></article>'}
function openGolf7(){let p=KASHO_PROFILES.golf7;home.classList.add('hidden');detail.classList.remove('hidden');detail.innerHTML='<div class="detailHead"><button class="back" onclick="closeDetail()">‹ Nazad</button><div><h1>'+p.title+'</h1><div class="meta">Type '+p.type+' • '+p.platform+' • '+p.years+'</div></div></div><div class="status">✓ Fabrička osnova verifikovana prema Volkswagen podacima.</div><div class="sectionTitle">Pregled</div><section class="panel"><div class="title">MQB platforma</div><div class="meta">'+p.drive+'</div></section><div class="sectionTitle">Motori</div><section class="panel">'+p.engines.map(e=>{let cr=e[0]==='2.0 TDI'&&e[2].includes('110 kW');return '<div class="engine '+(cr?'click':'')+'" '+(cr?'onclick="openCRBC()"':'')+'><div><b>'+e[0]+(cr?' <span class="accent">› CRBC</span>':'')+'</b><br><small>'+e[1]+' • '+e[3]+'</small></div><b>'+e[2]+'</b></div>'}).join('')+'</section><div class="sectionTitle">Tehničke napomene</div><section class="panel">'+p.notes.map(n=>'<div class="note">• '+n+'</div>').join('')+'</section>'}
function diagIcon(t){t=t.toLowerCase();if(t.includes('ulja'))return '<svg viewBox="0 0 24 24"><path d="M4 14h12l2-5h-6l-2-3H6v4H4z"/><path d="M18 14c0 2 1 3 2 3s2-1 2-3c0-1-2-3-2-3s-2 2-2 3z"/></svg>';if(t.includes('dpf'))return '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/><circle cx="10" cy="9" r=".7"/><circle cx="14" cy="12" r=".7"/><circle cx="10" cy="15" r=".7"/></svg>';if(t.includes('egr'))return '<svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 12-5"/><path d="M17 4v4h-4M19 12a7 7 0 0 1-12 5"/><path d="M7 20v-4h4"/></svg>';if(t.includes('boost'))return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12l5-4M7 16c2-4 7-5 10-2"/></svg>';return '<svg viewBox="0 0 24 24"><path d="M4 8h13v5H4zM7 13v5M11 13v5M15 13v5M17 10h3v7"/><path d="M5 6h11"/></svg>'}
function openCRBC(){let x=CRBC_PROFILE;detail.innerHTML='<div class="detailHead"><button class="back" onclick="openGolf7()">‹ Golf VII</button><div><h1>CRBC</h1><div class="meta">2.0 TDI • EA288 • 110 kW</div></div></div><div class="status">✓ Poseban tehnički karton motora • VW SSP 513 / 514</div><div class="sectionTitle">Specifikacije</div><section class="panel"><div class="title">'+x.name+' • '+x.code+'</div><div class="meta">'+x.displacement+' • '+x.power+' • '+x.torque+'</div><div class="tags"><span class="tag">'+x.ecu+'</span><span class="tag">'+x.compression+'</span><span class="tag">'+x.emissions+'</span></div><div class="note">'+x.aftertreatment+'</div></section><div class="sectionTitle">Menjači</div><section class="panel">'+x.gearboxes.map(g=>'<div class="engine"><div><b>'+g.code+' • '+g.name+'</b><br><small>'+g.type+'</small></div><b>'+g.drive+'</b></div>').join('')+'</section><div class="sectionTitle">Sistemi motora</div><section class="panel">'+x.systems.map(v=>'<div class="engine"><div><b>'+v[0]+'</b><br><small>'+v[2]+'</small></div><b>'+v[1]+'</b></div>').join('')+'</section><div class="sectionTitle">Live Data</div><section class="panel"><div class="status">✓ Brojčane reference su iz VW SSP 514; ostalo se procenjuje prema radnom stanju i specified/actual.</div>'+x.liveData.map(v=>'<div class="engine"><div><b>'+v[0]+'</b><br><small>'+v[2]+'</small></div><b>'+v[1]+'</b></div>').join('')+'</section><div class="sectionTitle">Dijagnostika</div><section class="panel">'+x.diagnostics.map(v=>'<div class="diagItem"><div class="diagIcon">'+diagIcon(v[0])+'</div><div class="diagText"><b>'+v[0]+'</b><span>'+v[1]+'</span></div></div>').join('')+'</section><div class="sectionTitle">Simptom → Dijagnostika</div><section class="panel">'+x.symptoms.map(v=>'<details class="card"><summary style="cursor:pointer;font-weight:750">'+v.title+'</summary>'+v.steps.map((st,n)=>'<div class="note"><b>'+(n+1)+'.</b> '+st+'</div>').join('')+'</details>').join('')+'</section><div class="sectionTitle">Servis</div><section class="panel">'+x.service.map(v=>'<div class="note"><b>'+v[0]+' — '+v[1]+'</b><br>'+v[2]+'</div>').join('')+'</section>'}
function closeDetail(){detail.classList.add('hidden');home.classList.remove('hidden');window.scrollTo(0,0)}
function render(){let data,type;if(view==='models'){data=KASHO_DATA.Models;type='models'}else if(view==='trans'){data=KASHO_DATA.Transmissions;type='trans'}else{data=fav().map(JSON.parse);type='models'}let s=q.value.trim().toLowerCase();if(s)data=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(s));count.textContent=data.length+' rezultata';list.innerHTML=data.length?data.map(x=>card(x,type)).join(''):'<div class="empty">Nema rezultata.</div>'}
q.addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
