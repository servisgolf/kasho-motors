<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>KASHO TECH</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;color:#f5f7fa;background:#0b0d10}*{box-sizing:border-box}body{margin:0;background:#0b0d10}.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:23px;font-weight:850;letter-spacing:.5px}.brand b{color:#ef4444}.pill{font-size:12px;background:#191d23;padding:7px 10px;border-radius:99px;color:#aeb6c2}.hero{background:linear-gradient(145deg,#181c22,#111419);padding:20px;border-radius:22px;border:1px solid #252a31;margin-bottom:14px}.hero h1{font-size:27px;margin:0 0 6px}.hero p{margin:0;color:#9ca6b4;font-size:14px}.search{width:100%;margin-top:16px;border:1px solid #303640;background:#0c0f13;color:white;border-radius:15px;padding:15px 16px;font-size:16px;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tab{border:0;border-radius:99px;background:#191d23;color:#bac2cd;padding:10px 14px;white-space:nowrap}.tab.active{background:#ef4444;color:#fff}.count{color:#7f8996;font-size:13px;margin:0 3px 10px}.card{background:#14181d;border:1px solid #242a31;border-radius:17px;padding:15px;margin:9px 0}.title{font-size:18px;font-weight:750}.meta{color:#9da7b3;font-size:13px;margin-top:5px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;background:#20252c;border-radius:8px;padding:5px 7px;color:#c5ccd5}.empty{text-align:center;color:#818b98;padding:40px 15px}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,16,.94);backdrop-filter:blur(15px);border-top:1px solid #222831;padding:10px 18px calc(10px + env(safe-area-inset-bottom));text-align:center;color:#7f8996;font-size:12px}
</style></head><body><div class="wrap"><header><div class="brand">KASHO <b>TECH</b></div><div class="pill">VW • EU • 2010–2026</div></header><section class="hero"><h1>Servisna baza</h1><p>Pretraži model, platformu, oznaku ili menjač.</p><input id="q" class="search" placeholder="npr. Golf VII, MQB, 0GC, DQ381…" autocomplete="off"></section><div class="tabs"><button class="tab active" data-view="models">Vozila</button><button class="tab" data-view="trans">Menjači</button><button class="tab" data-view="fav">★ Favorites</button></div><div id="count" class="count"></div><main id="list"></main></div><div class="footer">KASHO TECH • offline-ready</div><script src="data.js"></script><script>
let view='models'; const q=document.querySelector('#q'),list=document.querySelector('#list'),count=document.querySelector('#count');
const fav=()=>JSON.parse(localStorage.getItem('kashoFav')||'[]'); function key(x){return JSON.stringify(x)} function toggle(x){let a=fav(),k=key(x);a=a.includes(k)?a.filter(v=>v!==k):[...a,k];localStorage.setItem('kashoFav',JSON.stringify(a));render()}
function card(x,type){let vals=Object.values(x).filter(Boolean).map(String), title=type==='models'?(vals[0]||'VW'):(vals[0]||'Menjač');let sub=vals.slice(1,4).join(' • '),tags=vals.slice(4).filter(v=>v.length<70).slice(0,5);let k=key(x),star=fav().includes(k)?'★':'☆';return `<article class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="title">${esc(title)}</div><div class="meta">${esc(sub)}</div></div><button onclick='toggle(${JSON.stringify(x)})' style="background:none;border:0;color:#f6c453;font-size:24px">${star}</button></div><div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></article>`}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function render(){let data,type;if(view==='models'){data=KASHO_DATA.Models;type='models'}else if(view==='trans'){data=KASHO_DATA.Transmissions;type='trans'}else{data=fav().map(JSON.parse);type='models'}let s=q.value.trim().toLowerCase();if(s)data=data.filter(x=>Object.values(x).join(' ').toLowerCase().includes(s));count.textContent=`${data.length} rezultata`;list.innerHTML=data.length?data.map(x=>card(x,type)).join(''):'<div class="empty">Nema rezultata.</div>'}
q.addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
